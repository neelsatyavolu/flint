name = "flint-receipts"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Run daily at 03:17 UTC: purge events/messages older than 180 days and stale sender fingerprints.
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "flint-receipts"
# Production database (account 5eac7df5…).
database_id = "7589479c-5086-449d-8b9f-86abb810149e"
migrations_dir = "migrations"

# Secret, not a var. Set with: wrangler secret put FINGERPRINT_SALT

[[routes]]
pattern = "flintr.xanom.co"
custom_domain = true
