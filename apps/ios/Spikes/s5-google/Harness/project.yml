name: GoogleSpike
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  GoogleOAuthSpike:
    path: ..
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail.git
    revision: 88c45cbd31b347b373f7c87e197be63eb95efbc2
targets:
  GoogleSpike:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GoogleOAuthSpike
      - package: SwiftMail
    info:
      path: build/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.flint
